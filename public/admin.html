<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanLink | Painel Geral de Entregas (Admin)</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo-container">
      <img src="img/LogoHorizontal.svg" alt="UrbanLink Logo" class="logo-img">
    </a>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="simulacao.html">Simulação</a>
      <a href="entregas.html" class="nav-logado" style="display: none;">Entregas</a>
      <a href="estoque.html" class="nav-admin" style="display: none;">Estoque</a>
      <a href="veiculos.html" class="nav-admin" style="display: none;">Veículos</a>
      <a href="admin.html" class="active nav-admin" style="display: none;">Painel Admin</a>
      <a href="login.html" id="nav-btn-login" class="btn-nav-login">Entrar</a>
      <span id="nav-usuario-nome" style="font-weight: 700; color: var(--verde-escuro); display: none;"></span>
      <button id="nav-btn-logout" class="btn-nav-logout" style="display: none;" onclick="fazerLogout()">Sair</button>
    </nav>
  </header>

  <main class="container">
    <h1 class="titulo-pagina">Painel Geral de Gerenciamento de Entregas</h1>
    <p class="subtitulo-pagina">Alocação de frotas e alteração do status das entregas.</p>

    <div class="tabela-card">
      <h3 style="color: var(--verde-escuro); margin-bottom: 16px;">Entregas Solicitadas e em Operação</h3>
      <table class="tabela-custom">
        <thead>
          <tr>
            <th>Código Rastreio</th>
            <th>Destino</th>
            <th>Produto (Qtd)</th>
            <th>Veículo Alocado</th>
            <th>Status Atual</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="admin-entregas-body">
          <tr><td colspan="6" style="text-align: center;">Carregando entregas...</td></tr>
        </tbody>
      </table>

      <!-- CONTROLES DE PAGINAÇÃO LOCAL -->
      <div id="paginacao-admin"></div>
    </div>
  </main>

  <script src="js/comum.js"></script>
  <script>
    let paginaAtualAdmin = 1;
    const ITENS_POR_PAGINA_ADMIN = 6;
    let todasEntregasAdmin = [];
    let todosVeiculosAdmin = [];

    async function carregarEntregasAdmin() {
      const tbody = document.getElementById('admin-entregas-body');
      try {
        const resVeic = await fetchAutenticado('/veiculos');
        if (!resVeic.ok) throw new Error('Erro ao carregar veículos.');
        todosVeiculosAdmin = await resVeic.json();

        const resEntr = await fetchAutenticado('/entregas');
        if (!resEntr.ok) throw new Error('Erro ao carregar entregas.');
        const entregas = await resEntr.json();

        if (Array.isArray(entregas)) {
          // Ordenação: Do ID mais recente para o mais antigo
          todasEntregasAdmin = entregas.sort((a, b) => b.id - a.id);
        } else {
          todasEntregasAdmin = [];
        }

        renderizarTabelaAdmin();
      } catch (err) {
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Erro ao carregar entregas. Verifique se o servidor backend está rodando.</td></tr>';
        }
      }
    }

    function renderizarTabelaAdmin() {
      const tbodyEntregas = document.getElementById('admin-entregas-body');
      if (!tbodyEntregas) return;

      if (!todasEntregasAdmin.length) {
        tbodyEntregas.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhuma entrega encontrada.</td></tr>';
        renderizarControlesPaginacao('paginacao-admin', 0, 1, null);
        return;
      }

      const totalPaginas = Math.ceil(todasEntregasAdmin.length / ITENS_POR_PAGINA_ADMIN) || 1;
      if (paginaAtualAdmin > totalPaginas) paginaAtualAdmin = totalPaginas;
      if (paginaAtualAdmin < 1) paginaAtualAdmin = 1;

      const inicio = (paginaAtualAdmin - 1) * ITENS_POR_PAGINA_ADMIN;
      const fim = inicio + ITENS_POR_PAGINA_ADMIN;
      const entregasPagina = todasEntregasAdmin.slice(inicio, fim);

      const sanitizar = typeof protegerTexto === 'function' ? protegerTexto : (str) => str || '';

      tbodyEntregas.innerHTML = entregasPagina.map(e => {
        const st = (e.status || '').toLowerCase();

        return `
          <tr>
            <td><strong>${sanitizar(e.codigo_rastreio)}</strong></td>
            <td>${sanitizar(e.destino)}</td>
            <td>${e.Produto ? sanitizar(e.Produto.nome) : 'N/D'} (${e.peso_kg} un)</td>
            <td>
              <select id="adm-veiculo-${e.id}" style="padding: 6px; border-radius: 6px; border: 1px solid var(--azul-escuro);">
                <option value="">Sem veículo</option>
                ${todosVeiculosAdmin.map(v => `<option value="${v.id}" ${e.veiculo_id == v.id ? 'selected' : ''}>${sanitizar(v.modelo)} (${sanitizar(v.placa)})</option>`).join('')}
              </select>
            </td>
            <td>
              <select id="adm-status-${e.id}" style="padding: 6px; border-radius: 6px; border: 1px solid var(--azul-escuro); font-weight: 600;">
                <option value="pendente" ${st === 'pendente' ? 'selected' : ''}>Pendente</option>
                <option value="em_transito" ${st === 'em_transito' ? 'selected' : ''}>Em Trânsito</option>
                <option value="entregue" ${st === 'entregue' || st === 'concluido' ? 'selected' : ''}>Entregue</option>
              </select>
            </td>
            <td>
              <button class="btn-acao" onclick="salvarStatusAdmin(${e.id})">Salvar Alterações</button>
            </td>
          </tr>
        `;
      }).join('');

      renderizarControlesPaginacao('paginacao-admin', totalPaginas, paginaAtualAdmin, (novaPagina) => {
        paginaAtualAdmin = novaPagina;
        renderizarTabelaAdmin();
      });
    }

    async function salvarStatusAdmin(id) {
      const veiculo_id = document.getElementById(`adm-veiculo-${id}`).value;
      const status = document.getElementById(`adm-status-${id}`).value;

      try {
        const res = await fetchAutenticado(`/entregas/${id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, veiculo_id: veiculo_id || null })
        });

        if (res.ok) {
          alert('✅ Status e veículo atualizados com sucesso!');
          carregarEntregasAdmin();
        } else {
          const erro = await res.json();
          alert('⚠️ ' + (erro.mensagem || 'Erro ao atualizar a entrega.'));
        }
      } catch (err) {
        alert('⚠️ Erro de comunicação com o servidor.');
      }
    }

    document.addEventListener('DOMContentLoaded', carregarEntregasAdmin);
  </script>
</body>
</html>
