<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanLink | Entrar na Conta</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo-container">
    <img src="img/LogoHorizontal.svg" alt="UrbanLink Logo" class="logo-img">
  </a>
  <nav class="nav-links">
    <a href="index.html">Início</a>
    <a href="simulacao.html">Simulação</a>
    
    <!-- Link visível para qualquer usuário logado (Operador ou Admin) -->
    <a href="entregas.html" class="nav-logado" style="display: none;">Entregas</a>
    
    <!-- Links visíveis exclusivamente para Administradores -->
    <a href="estoque.html" class="nav-admin" style="display: none;">Estoque</a>
    <a href="veiculos.html" class="nav-admin" style="display: none;">Veículos</a>
    <a href="admin.html" class="nav-admin" style="display: none;">Painel Admin</a>
    
    <a href="login.html" id="nav-btn-login" class="btn-nav-login">Entrar</a>
    <span id="nav-usuario-nome" style="font-weight: 700; color: var(--verde-escuro); display: none;"></span>
    <button id="nav-btn-logout" class="btn-nav-logout" style="display: none;" onclick="fazerLogout()">Sair</button>
  </nav>
</header>

  <main class="container">
    <div class="card-login-box">
      <h1 class="titulo-pagina" style="text-align: center; margin-bottom: 8px;">Entrar na Conta</h1>
      <p class="subtitulo-pagina" style="text-align: center; font-size: 0.95rem; margin-bottom: 28px;">
        Acesse com suas credenciais de Operador ou Administrador!
      </p>

      <form id="form-login">
        <div class="coluna-inputs">
          <div class="input-pin-group">
            <span class="icon-pin">📍</span>
            <input type="email" id="login_email" placeholder="E-mail cadastrado" required autofocus>
          </div>

          <div class="input-pin-group">
            <span class="icon-pin">📍</span>
            <input type="password" id="login_senha" placeholder="Sua senha" required>
          </div>

          <button type="submit" class="btn-full" style="margin-top: 10px;">Entrar ➔</button>
        </div>

        <div id="alerta-login" class="alerta-box"></div>

        <p style="text-align: center; margin-top: 24px; font-size: 0.95rem;">
          Ainda não tem conta de Operador? <a href="usuario.html" style="color: var(--verde-escuro); font-weight: 700; text-decoration: underline;">Cadastre-se aqui</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="rodape-verde">
    <div class="footer-bottom" style="border: none; text-align: center;">
      UrbanLink Flow © 2026 | Sistema de Mobilidade e Logística
    </div>
  </footer>

  <script src="js/comum.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
