<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanLink | Gestão de Estoque (Admin)</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="logo-container">
      <img src="img/LogoHorizontal.svg" alt="UrbanLink Logo" class="logo-img">
    </a>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="simulacao.html">Simulação</a>

      <!-- Link visível para qualquer usuário logado (Operador ou Admin) -->
      <a href="entregas.html" class="nav-logado" style="display: none;">Entregas</a>

      <!-- Links visíveis exclusivamente para Administradores -->
      <a href="estoque.html" class="nav-admin" style="display: none;">Estoque</a>
      <a href="veiculos.html" class="nav-admin" style="display: none;">Veículos</a>
      <a href="admin.html" class="nav-admin" style="display: none;">Painel Admin</a>

      <a href="login.html" id="nav-btn-login" class="btn-nav-login">Entrar</a>
      <span id="nav-usuario-nome" style="font-weight: 700; color: var(--verde-escuro); display: none;"></span>
      <button id="nav-btn-logout" class="btn-nav-logout" style="display: none;" onclick="fazerLogout()">Sair</button>
    </nav>
  </header>

  <main class="container">
    <h1 class="titulo-pagina">Gestão de Estoque & Remessas</h1>
    <p class="subtitulo-pagina">Área restrita de controle de produtos em galpão corporativo.</p>

    <div class="tabela-card">
      <h3 style="color: var(--verde-escuro); margin-bottom: 16px;">Cadastrar Novo Item</h3>
      <form id="form-produto" style="margin-bottom: 24px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
          <input type="text" id="p_codigo" placeholder="Código *" required
            style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
          <input type="text" id="p_nome" placeholder="Nome *" required
            style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
          <input type="text" id="p_categoria" placeholder="Categoria"
            style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
          <input type="number" id="p_qtd" placeholder="Qtd Inicial" required min="0"
            style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
          <button type="submit" class="btn-acao" style="background-color: var(--verde-escuro); padding: 10px;">+
            Adicionar Item</button>
        </div>
      </form>

      <table class="tabela-custom">
        <thead>
          <tr>
            <th>Código</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Quantidade Atual</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-estoque-body">
          <tr>
            <td colspan="5" style="text-align: center;">Carregando estoque...</td>
          </tr>
        </tbody>
      </table>

      <div id="paginacao-estoque"></div>

    </div>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/estoque.js"></script>
</body>

</html>
