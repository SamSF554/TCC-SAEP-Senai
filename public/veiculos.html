<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanLink | Gestão de Veículos (Admin)</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="logo-container">
      <img src="img/LogoHorizontal.svg" alt="UrbanLink Logo" class="logo-img">
    </a>
    <nav class="nav-links">
      <a href="index.html">Início</a>
      <a href="simulacao.html">Simulação</a>

      <!-- Link visível para qualquer usuário logado (Operador ou Admin) -->
      <a href="entregas.html" class="nav-logado" style="display: none;">Entregas</a>

      <!-- Links visíveis exclusivamente para Administradores -->
      <a href="estoque.html" class="nav-admin" style="display: none;">Estoque</a>
      <a href="veiculos.html" class="nav-admin" style="display: none;">Veículos</a>
      <a href="admin.html" class="nav-admin" style="display: none;">Painel Admin</a>

      <a href="login.html" id="nav-btn-login" class="btn-nav-login">Entrar</a>
      <span id="nav-usuario-nome" style="font-weight: 700; color: var(--verde-escuro); display: none;"></span>
      <button id="nav-btn-logout" class="btn-nav-logout" style="display: none;" onclick="fazerLogout()">Sair</button>
    </nav>
  </header>

  <main class="container">
    <h1 class="titulo-pagina">Gestão de Veículos da Frota</h1>
    <p class="subtitulo-pagina">Área administrativa para cadastro e monitoramento de veículos.</p>

    <div class="tabela-card">
      <h3 style="color: var(--verde-escuro); margin-bottom: 16px;">Cadastrar Novo Veículo</h3>
      <form id="form-veiculo" style="margin-bottom: 24px;">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
          <input type="text" id="v_placa" placeholder="Placa *" required
            style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
          <input type="text" id="v_modelo" placeholder="Modelo *" required
            style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
          <select id="v_tipo" style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
            <option value="Carro">Carro</option>
            <option value="Moto">Moto</option>
            <option value="Caminhão">Caminhão</option>
            <option value="Bicicleta">Bicicleta</option>
          </select>
          <input type="number" id="v_capacidade" placeholder="Capacidade (kg) *" required min="1" value="100"
            style="padding: 10px; border-radius: 8px; border: 1.5px solid var(--azul-escuro);">
          <button type="submit" class="btn-acao" style="background-color: var(--verde-escuro); padding: 10px;">+
            Cadastrar Veículo</button>
        </div>
      </form>

      <table class="tabela-custom">
        <thead>
          <tr>
            <th>Placa</th>
            <th>Modelo</th>
            <th>Tipo</th>
            <th>Capacidade (kg)</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabela-veiculos-body">
          <tr>
            <td colspan="5" style="text-align: center;">Carregando frota...</td>
          </tr>
        </tbody>
      </table>
      <div id="paginacao-veiculos"></div>
    </div>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/veiculos.js"></script>
</body>

</html>
